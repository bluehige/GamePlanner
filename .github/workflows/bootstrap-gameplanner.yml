name: bootstrap-gameplanner

on:
  push:
    branches:
      - agent/game-production-skill-stack
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack verified GamePlanner payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import shutil
          import tarfile

          payload_dir = Path('.bootstrap')
          expected = '7280991e96c8d6c1d4f3044ee54d49accea1ede7ec9df34f689a779e673d4d7f'
          parts = sorted(payload_dir.glob('part-*'))
          if not (payload_dir / 'READY').exists():
              raise SystemExit('READY marker is missing')
          if len(parts) != 5:
              raise SystemExit(f'expected 5 payload parts, found {len(parts)}')
          encoded = ''.join(path.read_text(encoding='ascii').strip() for path in parts)
          archive = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(archive).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload checksum mismatch: {actual}')
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tar:
              for member in tar.getmembers():
                  destination = (Path.cwd() / member.name).resolve()
                  try:
                      destination.relative_to(Path.cwd().resolve())
                  except ValueError as exc:
                      raise SystemExit(f'unsafe archive path: {member.name}') from exc
              tar.extractall(path='.', filter='data')
          shutil.rmtree(payload_dir)
          PY
      - name: Commit unpacked repository
        shell: bash
        run: |
          git config user.name "gameplanner-bootstrap[bot]"
          git config user.email "gameplanner-bootstrap[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add numbered game production skill stack"
          git push origin HEAD
